<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Game regression check — forms disabled</title>
  <style>html, body, iframe { margin: 0; width: 100%; height: 100%; border: 0; display: block; }</style>
</head>
<body>
  <!-- Reproduce a host that allows scripts but blocks native form submission.
       This is a local compatibility test, not a copy of Qollab's runtime. -->
  <iframe title="Game with form submission disabled" src="./index.html"
    sandbox="allow-scripts allow-same-origin"></iframe>
</body>
</html>
